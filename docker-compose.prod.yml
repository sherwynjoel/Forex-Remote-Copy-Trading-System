# Production stack: Postgres + Redis + the backend API + Caddy (reverse
# proxy, automatic HTTPS, and the built dashboard's static files) — all on
# one small VPS. See docs/DEPLOYMENT.md for the actual setup walkthrough.
#
# Deliberately does NOT publish postgres/redis ports to the host — only
# `backend` can reach them, over the internal Docker network. Only Caddy
# is reachable from the outside world (80/443), and Caddy only forwards
# /api and /ws to the backend — the database is never directly exposed.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - forex_copy_pg:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --appendonly: idempotency keys, connector token cache, and heartbeat
    # freshness survive a container restart instead of resetting to empty.
    command: redis-server --appendonly yes
    volumes:
      - forex_copy_redis:/data
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [postgres, redis]
    env_file: .env.production
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on: [backend]

networks:
  internal:

volumes:
  forex_copy_pg:
  forex_copy_redis:
  caddy_data:
  caddy_config:
